name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Cancel superseded runs on the same PR — saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. Detect which services changed and emit a per-language matrix ─────────
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit   # Task 4.1: start in audit to learn egress, then tighten to block.

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # paths-filter diffs base..head

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            cart:      ['cart/**']
            catalogue: ['catalogue/**']
            user:      ['user/**']
            payment:   ['payment/**']
            dispatch:  ['dispatch/**']
            shipping:  ['shipping/**']
            ratings:   ['ratings/**']

      - name: Build matrix
        id: set
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}   # JSON array, via env to avoid script injection
        run: |
          set -euo pipefail
          MAP='{"cart":"node","catalogue":"node","user":"node","payment":"python","dispatch":"go","shipping":"java","ratings":"php"}'
          INCLUDE=$(jq -cn --argjson map "$MAP" --argjson changed "$CHANGES" \
            '[ $changed[] | select($map[.] != null) | {service: ., lang: $map[.]} ]')
          if [ "$INCLUDE" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "Changed code services: $INCLUDE"

  # ── 2. Lint + test each changed service on its own toolchain ────────────────
  lint-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false   # one service failing shouldn't hide the others
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    name: lint-test (${{ matrix.service }} · ${{ matrix.lang }})
    env:
      SERVICE: ${{ matrix.service }}   # via env — never interpolate matrix into run scripts directly
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ---- Node.js (cart, catalogue, user) ----
      - name: Node · setup
        if: matrix.lang == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'   # current LTS

      - name: Node · lint (eslint, shared flat config)
        if: matrix.lang == 'node'
        run: |
          set -euo pipefail
          # Services ship no eslint config/deps; install the shared toolchain at repo root
          # where eslint.config.mjs lives, then lint the service source.
          npm install --no-save --no-fund --no-audit eslint@^10 @eslint/js@^10 globals
          npx eslint "$SERVICE"

      - name: Node · test (skip upstream stub)
        if: matrix.lang == 'node'
        run: |
          set -euo pipefail
          TESTS=$(cd "$SERVICE" && npm pkg get scripts.test | tr -d '"')
          if echo "$TESTS" | grep -q "no test specified"; then
            echo "::warning title=No unit tests::$SERVICE still has the upstream stub — add real tests to gate this leg."
          else
            ( cd "$SERVICE" && npm ci && npm test )
          fi

      # ---- Python (payment) ----
      - name: Python · setup
        if: matrix.lang == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Python · lint + test
        if: matrix.lang == 'python'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip ruff pytest
          # Minimal-but-real gate: syntax errors + undefined names. Expand rules in pyproject when ready.
          ruff check --select E9,F63,F7,F82 "$SERVICE"
          if find "$SERVICE" -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            # Uncomment if tests import the app: pip install -r "$SERVICE/requirements.txt"
            ( cd "$SERVICE" && pytest -q )
          else
            echo "::warning title=No unit tests::$SERVICE has no pytest tests yet — skipping."
          fi

      # ---- Go (dispatch) ----
      - name: Go · setup
        if: matrix.lang == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod   # reads go 1.23 from the module

      - name: Go · lint
        if: matrix.lang == 'go'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          working-directory: ${{ matrix.service }}
          version: latest

      - name: Go · test
        if: matrix.lang == 'go'
        run: cd "$SERVICE" && go test ./...   # passes cleanly with no test files

      # ---- Java 8 / Maven (shipping) ----
      - name: Java · setup
        if: matrix.lang == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'    # matches pom <java.version>1.8</java.version>
          cache: maven

      - name: Java · build + test
        if: matrix.lang == 'java'
        run: cd "$SERVICE" && mvn -B -ntp verify

      - name: Java · checkstyle (report-only)
        if: matrix.lang == 'java'
        continue-on-error: true   # modern checkstyle wants JDK 11+; non-blocking on 8
        run: cd "$SERVICE" && mvn -B -ntp checkstyle:check -Dcheckstyle.failOnViolation=false || true

      # ---- PHP (ratings) ----
      - name: PHP · setup
        if: matrix.lang == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer, phpcs, phpunit

      - name: PHP · lint + test
        if: matrix.lang == 'php'
        working-directory: ${{ matrix.service }}/html   # composer + source live here
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          # PSR-12, report-only for legacy code — flip to blocking after cleanup.
          phpcs --standard=PSR12 --report=full src index.php info.php || echo "::warning title=phpcs::PSR-12 findings (report-only)"
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            vendor/bin/phpunit
          else
            echo "::warning title=No unit tests::ratings has no phpunit config yet — skipping."
          fi

  ci-gate:
    needs: [detect-changes, lint-test, secret-scan, sast, sca-iac, dockerfile-lint, build-scan-sbom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        run: |
          for r in "${{ needs.detect-changes.result }}" "${{ needs.lint-test.result }}" \
                   "${{ needs.secret-scan.result }}" "${{ needs.sast.result }}" \
                   "${{ needs.sca-iac.result }}" "${{ needs.dockerfile-lint.result }}" \
                   "${{ needs.build-scan-sbom.result }}"; do
            [ "$r" = "failure" ] && { echo "A required check failed."; exit 1; }
          done
          echo "All required checks passed."

# ──  Shift-left security gates (repo-wide, every PR) ──────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Gitleaks (pinned binary, not a wrapper action)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --report-format sarif --report-path gitleaks.sarif --exit-code 1   # BLOCKING — repo is clean today
      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''   # skip upload if the scan produced nothing
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { sarif_file: gitleaks.sarif, category: gitleaks }

  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }   # note: this job reaches semgrep.dev for rules — allowlist it in block mode
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: Semgrep (p/ci ruleset) → SARIF
        run: |
          pip install semgrep
          # REPORT-ONLY: drop `|| true` and add `--error` to make it blocking after baselining.
          semgrep scan --config p/ci --sarif --output semgrep.sarif || true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''   # skip upload if the scan produced nothing
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { sarif_file: semgrep.sarif, category: semgrep }

  sca-iac:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # CVE-2026-33634 (Mar 2026): trivy-action tags 0.0.1–0.34.2 were compromised via force-pushed tags.
      # Pinned to v0.36.0 (first-safe was 0.35.0) by commit SHA, not tag, so this can't be silently re-pointed.
      - name: Trivy (deps + secrets + misconfig) → SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: '0'          # REPORT-ONLY: flip to '1' after triaging into .trivyignore
          trivyignores: .trivyignore
      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''   # skip upload if the scan produced nothing
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { sarif_file: trivy.sarif, category: trivy }

  dockerfile-lint:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Hadolint (all Dockerfiles) → SARIF
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
          FILES=$(find . -name Dockerfile -not -path '*/node_modules/*')
          hadolint -f sarif $FILES > hadolint.sarif || true
          # BLOCKING on error-level only — current findings are warning/info, so this is green today.
          hadolint --failure-threshold error $FILES
      - name: Upload SARIF
        if: always() && hashFiles('hadolint.sarif') != ''   # skip upload if the scan produced nothing
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { sarif_file: hadolint.sarif, category: hadolint }

  build-scan-sbom:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write        # Trivy image SARIF -> Security tab
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    name: build-scan-sbom (${{ matrix.service }})
    env:
      IMAGE: ${{ matrix.service }}:pr-${{ github.sha }}
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3          # ⚠️ pin before push

      - name: Build image (no push; load for scanning)
        uses: docker/build-push-action@v6            # ⚠️ pin before push
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true                                 # into local docker daemon so Trivy/Syft can read it
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'                             # report-only: flip to '1' after baselining
          trivyignores: .trivyignore
      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}   # unique per service so legs don't overwrite

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0                 # ⚠️ pin before push
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json
          artifact-name: sbom-${{ matrix.service }}   # unique artifact name per leg (upload-artifact v4 requires it)
       