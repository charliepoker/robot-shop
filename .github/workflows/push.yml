name: docker-compose-actions-workflow
on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'K8s/**'
      - 'load-gen/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build stack
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          # audit first to capture the full egress map in the run's security
          # insights page; switch to `block` with an `allowed-endpoints` list
          # once a clean audit run has been reviewed.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the stack
        run: docker-compose build

  zizmor:
    name: Lint workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for github/codeql-action/upload-sarif
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run zizmor
        # continue-on-error so a non-zero exit (findings present) still lets
        # the SARIF upload run below, instead of the job just going red with
        # nothing visible in the Security tab.
        continue-on-error: true
        run: uvx zizmor --format sarif .github/workflows/ > zizmor.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor
